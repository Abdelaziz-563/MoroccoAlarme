name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Command Line Tools
        run: |
          mkdir -p $HOME/Android/Sdk/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
          mv /tmp/cmdline-extract/cmdline-tools/* $HOME/Android/Sdk/cmdline-tools/latest/

      - name: Accept Android Licenses and Install Packages
        env:
          ANDROID_HOME: /home/runner/Android/Sdk
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Dependencies
        run: npm ci

      - name: Install Capacitor Android
        run: npm install @capacitor/android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        env:
          ANDROID_HOME: /home/runner/Android/Sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morocco-alarme-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
